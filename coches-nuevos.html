

<!DOCTYPE html>

<html lang="es">

<head>

<title>Historia del Automóvil</title>

<style>

header{text-align:center;padding:25px;background:#080808}

header h1{color:#ff5252}

#coches{max-width:900px;margin:auto;padding:15px;

display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}

.card{background:#1d1d1d;border-radius:14px;overflow:hidden}

.card img{width:100%;height:220px;object-fit:cover}

.info{padding:13px}

h2{color:#ff5252;font-size:19px;margin:0 0 8px}

p{margin:5px 0;color:#bbb}

.precio{color:white!important}

</style>

</head>
