<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Coches de la Historia</title>
<meta name="description" content="Catálogo de coches de todas las épocas con año, precio original y precio actual.">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header>
<h1>🚗 Catálogo de Coches</h1>
<p>Desde 1886 hasta hoy</p>
</header>
<main>
<input type="text" id="buscador" placeholder="Busca marca o modelo...">
<select id="epoca">
<option value="todas">Todas las épocas</option>
<option value="1880">1880 - 1919</option>
<option value="1920">1920 - 1959</option>
<option value="1960">1960 - 1999</option>
<option value="2000">2000 - hoy</option>
</select>
<div id="lista"></div>
</main>
<script src="coches.js"></script>
<script src="app.js"></script>
</body>
</html>
